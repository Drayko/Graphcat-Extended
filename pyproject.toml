[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphcat-extended"
version = "1.1.0"
description = "Generate advanced graphs and statistics on password cracking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "zblurx", email = "seigneuret.thomas@protonmail.com"}
]
maintainers = [
    {name = "drayko"}
]
keywords = ["pentest", "password", "cracking", "hashcat", "ntds", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.8"
dependencies = [
    "matplotlib>=3.9.0",
    "fpdf2>=2.7.6",
    "zxcvbn-python>=4.4.0",
    "tqdm>=4.66.0",
]

# Optional: HTML/CSS rendering engine. Needs Pango, Cairo and GDK-PixBuf,
# which pip cannot install. The default fpdf2 engine needs none of them.
[project.optional-dependencies]
weasyprint = [
    "weasyprint>=61.0",
    "Jinja2>=3.1.4",
]

[project.scripts]
graphcat-extended = "graphcat:main"

[project.urls]
Homepage = "https://github.com/Orange-Cyberdefense/graphcat"

[tool.setuptools]
py-modules = ["graphcat"]
